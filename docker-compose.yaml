services:
  product_app:
    image: tonaliteh_app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_REG: ${DOCKER_REG}
    container_name: "App"
    volumes:
      - ./app:/home/app
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      APP_MODE: "Production"
      DJANGO_SECRET_KEY: $DJANGO_SECRET_KEY
      DJANGO_SUPERUSER_USERNAME: $DJANGO_SUPERUSER_USERNAME
      DJANGO_SUPERUSER_PASSWORD: $DJANGO_SUPERUSER_PASSWORD
      # LICENSE_KEY: $LICENSE_K
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_HOST: db
      POSTGRES_PORT: $POSTGRES_PORT
      GUNICORN_WORKER_NUMBER: $GUNICORN_WORKER_NUMBER
      GUNICORN_TIMEOUT: $GUNICORN_TIMEOUT
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    container_name: tonaliteh_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: "tonaliteh_redis"
    ports:
      - "6379:6379"

volumes:
  db_data: {}
